server:
  port: 8080

spring:
  application:
    name: ai-study-companion

  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/studycompanion;AUTO_SERVER=TRUE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  admin:
    email: ${ADMIN_EMAIL:admin@studycompanion.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-in-production-please-0123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
  ai:
    provider: ${AI_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1/messages}
    mock-mode: ${AI_MOCK_MODE:true}
    retrieval:
      top-k: ${RETRIEVAL_TOP_K:5}
      min-relevance-score: ${RETRIEVAL_MIN_SCORE:0.08}

logging:
  level:
    com.aistudy.companion: INFO
    org.springframework.security: WARN
